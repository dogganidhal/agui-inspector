# PR checks only. This workflow builds and tests; it never publishes, tags or releases.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    env:
      # uv reads this for `uv sync` and `uv run` in scripts/ci.mjs, so the Python tests run on each version.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      # The next two steps only prepare tooling for suites that exist; scripts/ci.mjs reports the
      # missing ones as pending and fails an introduced suite that cannot run.
      - if: ${{ hashFiles('tests/e2e/**/*.spec.ts') != '' }}
        run: npm exec -- playwright install --with-deps chromium
      - if: ${{ hashFiles('packages/python/pyproject.toml') != '' }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.22
          enable-cache: false
      - run: npm run check:ci
