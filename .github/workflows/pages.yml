# Deploys the public demo to GitHub Pages from main. It builds the isolated demo directory, checks it, and
# uploads only that directory. It never builds from a pull request, ships a package, tags or releases.
# Pages itself (the Actions source and the github-pages environment limited to main) is enabled by the
# maintainer in the repository settings; nothing here changes a setting.
name: Pages

on:
  push:
    branches: [main]
  # A manual run is allowed, but both jobs refuse any ref other than main.
  workflow_dispatch:

# Nothing by default; each job names exactly what it needs.
permissions: {}

# One deployment at a time. A queued run waits for the active one instead of cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build demo artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Only to read the site's origin and base path below; the build job cannot write anything.
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      # Reads the site's origin and base path. No input is set, so it cannot enable Pages: it fails when
      # the maintainer has not.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        id: pages
      # The examples' URLs carry this origin and base path. The build refuses anything that is not one
      # plain origin and one plain absolute path, so a bad value stops here rather than shipping.
      - run: node scripts/build-demo.mjs --outdir .build/public-demo --origin "$PAGES_ORIGIN" --base-path "$PAGES_BASE_PATH/"
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      # Every shipped demo asset counts against the same limits as the ordinary build.
      - run: node scripts/bundle-budget.mjs --dir .build/public-demo
      # The build, isolation and workflow checks; they need no browser, no uv and no previous build.
      - run: npm run test:unit -- tests/demo/build.test.ts
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .build/public-demo

  deploy:
    name: deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
