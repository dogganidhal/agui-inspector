[project]
name = "agui-inspector"
version = "0.0.0"
description = "AG-UI inspector: prebuilt static assets and an opt-in Starlette/FastAPI mount helper."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
dependencies = []

[project.optional-dependencies]
embedded = ["starlette==1.7.0"]

[dependency-groups]
test = ["fastapi==0.142.2", "httpx2==2.13.1", "uvicorn==0.54.0"]

[build-system]
requires = ["uv_build==0.12.22"]
build-backend = "uv_build"
