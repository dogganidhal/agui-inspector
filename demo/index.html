<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The shared page's policy plus worker-src for the demo's own worker. The app adds its connect-src policy at startup. -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'" />
    <title>agui-inspector demo</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230a0a0a%22/%3E%3Cg transform=%22translate(4 4)%22 color=%22%23fff%22 fill=%22none%22 stroke=%22currentColor%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Ccircle cx=%224.5%22 cy=%2212%22 r=%223%22 fill=%22currentColor%22 stroke=%22none%22/%3E%3Cpath d=%22M7.5 12H14%22/%3E%3Crect x=%2214%22 y=%228%22 width=%228%22 height=%228%22 rx=%222%22/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./app.css" />
    <link rel="stylesheet" href="./demo.css" />
  </head>
  <body>
    <div class="demo-strip">
      <p id="demo-status" role="status">Preparing the browser-local examples…</p>
      <p>
        The examples are scripted agents that run inside this page. They are not a real model or server. To inspect your
        own server, type its URL in the connection bar.
        <a href="https://dogganidhal.github.io/agui-inspector/docs/embedding/" rel="noopener noreferrer">Embedding guide</a>
      </p>
    </div>
    <!-- Not #root: the shared app mounts itself there when it finds one, and the demo mounts it once, after the examples are ready or known to be unavailable. -->
    <div id="demo-mount"></div>
    <script type="module" src="./bootstrap.js"></script>
  </body>
</html>
